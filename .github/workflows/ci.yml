name: AI Ticket System CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          uv sync

      - name: Verify Backend Imports
        run: |
          uv run python -c "from backend.config import MODELS; print('Loaded models:', MODELS)"
        env:
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "dummy-key-for-ci"
          GEMINI_API_KEY: "dummy-key-for-ci"

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies & Build
        run: |
          if [ -d "frontend-react" ]; then
            cd frontend-react
            npm ci || npm install
            npm run build --if-present
          fi